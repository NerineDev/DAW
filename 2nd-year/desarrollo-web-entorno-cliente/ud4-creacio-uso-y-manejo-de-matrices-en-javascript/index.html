<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="pagina">
    <h1>Gestor de Productos</h1>

    <form id="formularioProducto" autocomplete="off">
      <label>
        Nombre del producto
        <input id="nombre" type="text" placeholder="e.j. Teclado" required />
      </label>

      <label>
        Precio
        <input id="precio" type="text" placeholder="e.j. 39.99" required />
      </label>

      <label>
        Cantidad
        <input id="cant" type="text" placeholder="e.j. 10" required />
      </label>

      <button type="submit">Añadir</button>
    </form>

    <form id="formularioBusqueda" autocomplete="off">
      <label>
        Buscar productos
        <input id="busqueda" type="text" placeholder="Escribe para filtrar por nombre..." />
      </label>

      <button type="submit">Buscar</button>
    </form>

    <p id="hint" class="hint">Consejo: usa el cuadro de búsqueda para filtrar productos por nombre.</p>

    <article>
      <h2>Inventario</h2>

      <table id="tablaProductos" class="tabla">
        <thead>
          <tr>
            <th align="left">Nombre</th>
            <th align="left">Precio</th>
            <th align="left">Cantidad</th>
            <th align="left">Total</th>
            <th align="left">Acciones</th>
          </tr>
        </thead>
        <tbody id="filasProductos"></tbody>
      </table>

      <p id="sinresultados" class="no-resultados oculto">No se encontraron productos.</p>
      <hr />
      <p><strong>Valor total del inventario:</strong> <span id="granTotal">0.00</span></p>
    </article>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
