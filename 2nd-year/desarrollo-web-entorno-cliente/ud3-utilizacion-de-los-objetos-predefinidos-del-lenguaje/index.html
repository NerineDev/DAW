<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header style="text-align:center; margin-top:2em;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 1em; margin-bottom: 1em;">
            <a href="index.html" style="display: flex; align-items: center;">
                <img src="./img/5.png" class="logo" alt="Logo">
            </a>
            <h1 style="margin: 0;">Cita Pro</h1>
        </div>
    </header>
    <main>
        <h2 style="text-align:center; margin-bottom: 1.5em;">Formulario de registro</h2>
        <form id="registerForm" method="post">
    
    <!-- Fila Usuario -->
    <div class="fila1">
        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" placeholder="Inserta tu nombre de usuario" required>
        <span id="error-usuario" class="error"></span>
    </div>

    <!-- Fila Nombre y Apellido -->
    <div class="fila2">
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Inserta tu nombre" required>
            <span id="error-nombre" class="error"></span>
        </div>
        <div>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Inserta tu apellido" required>
            <span id="error-apellido" class="error"></span>
        </div>
    </div>

    <!-- Fila Fecha de Nacimiento -->
    <div class="fila1">
        <label for="fecha-nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha-nacimiento" required>
        <span id="error-fecha-nacimiento" class="error"></span>
    </div>

    <!-- Fila Contraseña -->
    <div class="fila2">
        <div>
            <label for="password">Contraseña</label>
            <div class="campo-pass">
                <input type="password" id="password" placeholder="Inserta tu contraseña" required>
                <label class="ojo">
                    <input type="checkbox" id="ver-pass">
                    👁️
                </label>
            </div>
            <span id="error-password" class="error"></span>
        </div>

        <div>
            <label for="password2">Repite la contraseña</label>
            <div class="campo-pass">
                <input type="password" id="password2" placeholder="Repite tu contraseña" required>
                <label class="ojo">
                    <input type="checkbox" id="ver-pass2">
                    👁️
                </label>
            </div>
            <span id="error-password2" class="error"></span>
        </div>
    </div>

    <!-- Fila Email -->
    <div class="fila1">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="Inserta tu correo electrónico" required>
        <span id="error-email" class="error"></span>
    </div>

    <div class="fila1">
        <label for="email2">Repite el correo electrónico</label>
        <input type="email" id="email2" placeholder="Repite tu correo electrónico" required>
        <span id="error-email2" class="error"></span>
    </div>

    <button type="submit">Registrarse</button>

</form>

    </main>
    <footer>
        <p>&copy; 2026 Ana Vertedor</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
